<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Game</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 2rem;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        select, button.control-btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            background: #334155;
            color: var(--text-main);
            font-size: 0.95rem;
            cursor: pointer;
            outline: none;
        }

        button.control-btn {
            background-color: var(--primary);
            color: #000;
            font-weight: bold;
            transition: background 0.2s;
        }

        button.control-btn:hover {
            background-color: var(--primary-hover);
            color: #fff;
        }

        .status-bar {
            margin: 15px 0;
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .word-display {
            font-size: 2.2rem;
            font-family: monospace;
            letter-spacing: 8px;
            margin: 25px 0;
            min-height: 50px;
            color: var(--primary);
            font-weight: bold;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 20px;
        }

        .key-btn {
            padding: 12px 0;
            background: #334155;
            border: none;
            border-radius: 6px;
            color: var(--text-main);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .key-btn:hover:not(:disabled) {
            background: var(--primary);
            color: #000;
        }

        .key-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 30px;
        }

        .message.win { color: var(--accent-green); }
        .message.lose { color: var(--accent-red); }

        /* Simple SVG Hangman Canvas */
        .hangman-drawing {
            width: 150px;
            height: 150px;
            margin: 0 auto;
        }

        .draw-part {
            stroke: var(--text-main);
            stroke-width: 4;
            fill: none;
            stroke-linecap: round;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>HANGMAN</h1>

    <div class="controls">
        <select id="difficulty-select">
            <option value="easy">Easy (8 Attempts)</option>
            <option value="medium" selected>Medium (6 Attempts)</option>
            <option value="hard">Hard (4 Attempts)</option>
        </select>
        <button class="control-btn" onclick="startNewGame()">New Game</button>
    </div>

    <!-- Hangman Graphic -->
    <svg class="hangman-drawing" viewBox="0 0 100 100">
        <!-- Base Gallows -->
        <line x1="10" y1="90" x2="90" y2="90" stroke="#475569" stroke-width="4"/>
        <line x1="30" y1="90" x2="30" y2="10" stroke="#475569" stroke-width="4"/>
        <line x1="30" y1="10" x2="70" y2="10" stroke="#475569" stroke-width="4"/>
        <line x1="70" y1="10" x2="70" y2="25" stroke="#475569" stroke-width="3"/>

        <!-- Body Parts (Revealed based on incorrect guesses) -->
        <circle id="part-0" class="draw-part" cx="70" cy="33" r="8"/> <!-- Head -->
        <line id="part-1" class="draw-part" x1="70" y1="41" x2="70" y2="65"/> <!-- Body -->
        <line id="part-2" class="draw-part" x1="70" y1="48" x2="55" y2="58"/> <!-- Left Arm -->
        <line id="part-3" class="draw-part" x1="70" y1="48" x2="85" y2="58"/> <!-- Right Arm -->
        <line id="part-4" class="draw-part" x1="70" y1="65" x2="55" y2="80"/> <!-- Left Leg -->
        <line id="part-5" class="draw-part" x1="70" y1="65" x2="85" y2="80"/> <!-- Right Leg -->
    </svg>

    <div class="status-bar">
        Attempts Remaining: <span id="attempts-left" style="color: var(--primary); font-weight: bold;">-</span>
    </div>

    <div class="word-display" id="word-display">_ _ _ _ _</div>

    <div class="message" id="message"></div>

    <div class="keyboard" id="keyboard"></div>
</div>

<script>
    const alphabet = 'abcdefghijklmnopqrstuvwxyz'.split('');
    let maxAttempts = 6;

    function renderKeyboard() {
        const keyboard = document.getElementById('keyboard');
        keyboard.innerHTML = '';
        alphabet.forEach(letter => {
            const btn = document.createElement('button');
            btn.className = 'key-btn';
            btn.id = `key-${letter}`;
            btn.innerText = letter.toUpperCase();
            btn.onclick = () => makeGuess(letter);
            keyboard.appendChild(btn);
        });
    }

    async function startNewGame() {
        const difficulty = document.getElementById('difficulty-select').value;
        const response = await fetch('/api/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ difficulty })
        });
        const state = await response.json();
        updateUI(state);
    }

    async function makeGuess(letter) {
        document.getElementById(`key-${letter}`).disabled = true;
        
        const response = await fetch('/api/guess', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ letter })
        });
        const state = await response.json();
        updateUI(state);
    }

    function updateUI(state) {
        // Display word
        document.getElementById('word-display').innerText = state.display;
        document.getElementById('attempts-left').innerText = state.attempts_left;

        // Reset/Update Keyboard states
        alphabet.forEach(letter => {
            const btn = document.getElementById(`key-${letter}`);
            if (btn) {
                btn.disabled = state.guessed.includes(letter) || state.status !== 'playing';
            }
        });

        // Update Hangman Drawing
        const incorrectCount = 6 - state.attempts_left; 
        for (let i = 0; i < 6; i++) {
            const part = document.getElementById(`part-${i}`);
            if (part) {
                part.style.display = i < incorrectCount ? 'block' : 'none';
            }
        }

        // Game Status Messages
        const msgEl = document.getElementById('message');
        if (state.status === 'won') {
            msgEl.className = 'message win';
            msgEl.innerText = '🎉 You Won!';
        } else if (state.status === 'lost') {
            msgEl.className = 'message lose';
            msgEl.innerText = `💥 Game Over! Word was: ${state.word}`;
        } else {
            msgEl.className = 'message';
            msgEl.innerText = '';
        }
    }

    // Initialize keyboard and start game on page load
    renderKeyboard();
    startNewGame();
</script>

</body>
</html>
